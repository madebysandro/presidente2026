version: 2
# package.json overrides pin undici 7.30.1 and sharp 0.35.5.
# Ceiling: @cloudflare/vitest-plugin@1.4.7 vendors miniflare 5.20261019.2-beta
# with undici 7.29.1. sharp there is already 0.35.5. The undici override stays
# necessary because that miniflare still declares 7.29.1. Drop it when that
# miniflare ships 7.30.1.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # #54 → #93 / #109: manter Vitest 5, sem voltar ao pool antigo.
      - dependency-name: vitest
        versions: ["<5.0.0"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
