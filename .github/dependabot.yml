version: 2
# package.json overrides pin undici 7.30.1 and sharp 0.35.5.
# Ceiling, still declaring undici 7.29.1: direct devDependency
# miniflare@5.20261012.0-beta; miniflare@5.20261012.1-beta under void, cf, and
# @cloudflare/runtime-types; @cloudflare/workers-auth@0.14.1 and
# @cloudflare/workers-utils@0.47.3. @cloudflare/vitest-plugin@1.4.8 already
# vendors miniflare@5.20261023.0-beta, which declares undici 7.30.1.
# Keep the undici override. It is the documented contract while that ceiling holds.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # #54 → #93 / #109: manter Vitest 5, sem voltar ao pool antigo.
      - dependency-name: vitest
        versions: ["<5.0.0"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
