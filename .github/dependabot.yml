version: 2
# package.json overrides pin undici 7.30.0 and sharp 0.35.5.
# Ceiling: @cloudflare/vitest-pool-workers@0.23.0 vendors miniflare with
# undici 7.29.0 and sharp 0.35.2. Drop the overrides when the pool ships patches.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
