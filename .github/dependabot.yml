version: 2
# package.json overrides pin undici 7.30.0 and sharp 0.35.5.
# Ceiling: @cloudflare/vitest-plugin@1.4.5 vendors miniflare 5.20261019.0-beta
# with undici 7.29.1. sharp there is already 0.35.5. Drop the undici override
# when that miniflare ships 7.30.0.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
