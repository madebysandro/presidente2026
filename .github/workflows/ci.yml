name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/pre-deploy.mjs
      - run: node --test scripts/pre-deploy.test.mjs scripts/ponte-preview.test.mjs
      # Miniflare puro, sem o resolvedor do vitest: pega import que só o Node resolve.
      - run: node scripts/sondar-agente.mjs
      - run: npm test
