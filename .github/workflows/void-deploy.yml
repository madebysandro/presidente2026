name: Deploy to Cloudflare
on:
  push:
    branches: [main]

concurrency:
  group: void-cloudflare-deploy-${{ github.repository }}-${{ github.ref }}
  # Não cancela deploy em andamento: corte no meio deixa Worker/DO inconsistentes.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21"
          cache: npm
      - run: npm ci
      - name: Deploy
        env:
          # Sandro: Settings → Secrets and variables → Actions → CLOUDFLARE_API_TOKEN
          # Token: Workers Scripts Edit + Workers Routes Edit; conta da zona presidente2026.win.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        run: npm run deploy
