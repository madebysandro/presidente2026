<!doctype html>
<!--
  PROTOTYPE (descartável) — pergunta: "que cara o site do 2º turno pode ter, em vez do painel escuro denso?"
  Três direções radicalmente diferentes para a página antes das 17h de 25/10, via ?variant=A|B|C:
  A · Três semanas (calendário) · B · Fiel da balança (uma coluna calma) · C · Cabo de guerra (tela cheia, rolagem).
  Dados reais das pesquisas (TSE + imprensa, 15/10). Branch: prototipo/pesquisas · NÃO mergear na main.
-->
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Protótipo · Novo design · Presidente 2026</title>
		<link rel="stylesheet" href="css/fontes.css" />
		<style>
			*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
			html { scrollbar-gutter: stable; } /* a vinheta trava a rolagem sem o layout pular */
			img { display: block; max-width: 100%; }
			/* pontos e linhas desligados no gráfico (compartilhado) */
			svg .t-pt, svg .t-inst { transition: opacity .35s, r .35s; }
			svg .t-pt.off { opacity: 0; r: 0; }
			svg .t-inst { opacity: .6; }
			svg .t-inst.off { opacity: 0; }
			/* barra do protótipo — NÃO faz parte do design */
			#ps { position: fixed; z-index: 99; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 999px; background: #ff2d78; color: #fff; font: 600 13px/1.2 system-ui, sans-serif; box-shadow: 0 8px 28px rgba(0,0,0,.35); }
			#ps button { all: unset; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.22); cursor: pointer; }
			#ps small { display: block; font-weight: 400; opacity: .9; }
			#ps div { min-width: 170px; text-align: center; }
		</style>
		<link rel="stylesheet" href="css/a.css" />
		<link rel="stylesheet" href="css/b.css" />
		<link rel="stylesheet" href="css/c.css" />
	</head>
	<body>
		<div id="app"></div>
		<script type="module">
			import { carregar } from "./js/dados.js";
			const VAR = { A: "./js/a.js", B: "./js/b.js", C: "./js/c.js" };
			const chaves = Object.keys(VAR);
			const q = new URLSearchParams(location.search);
			const v = VAR[q.get("variant")] ? q.get("variant") : "A";
			document.body.dataset.v = v;
			const [mod, m] = await Promise.all([import(VAR[v]), carregar()]);
			mod.render(m, document.querySelector("#app"));

			const ir = (d) => {
				const u = new URL(location.href);
				u.searchParams.set("variant", chaves[(chaves.indexOf(v) + d + chaves.length) % chaves.length]);
				location.assign(u.href);
			};
			const bar = document.createElement("div");
			bar.id = "ps";
			bar.innerHTML = `<button type="button" aria-label="Direção anterior" data-d="-1">←</button><div>${v} · ${mod.nome}<small>direção ${chaves.indexOf(v) + 1}/3 · setas ← →</small></div><button type="button" aria-label="Próxima direção" data-d="1">→</button>`;
			bar.addEventListener("click", (e) => { const b = e.target.closest("[data-d]"); if (b) ir(+b.dataset.d); });
			document.body.append(bar);
			addEventListener("keydown", (e) => {
				if (e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement) return;
				if (e.key === "ArrowLeft") ir(-1);
				if (e.key === "ArrowRight") ir(1);
			});
		</script>
	</body>
</html>
